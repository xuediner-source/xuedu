apply plugin: 'com.android.application'

def packageVersion = new groovy.json.JsonSlurper().parse(file('../../package.json')).version
def configuredVersionName = project.findProperty('appVersionName') ?: System.getenv('APP_VERSION') ?: System.getenv('VITE_APP_VERSION') ?: packageVersion
def configuredVersionCode = project.findProperty('appVersionCode') ?: System.getenv('ANDROID_VERSION_CODE') ?: '250'
def releaseStoreFile = System.getenv('ANDROID_KEYSTORE_PATH')
def releaseStorePassword = System.getenv('ANDROID_KEYSTORE_PASSWORD')
def releaseKeyAlias = System.getenv('ANDROID_KEY_ALIAS')
def releaseKeyPassword = System.getenv('ANDROID_KEY_PASSWORD')
def releaseSigningReady = [releaseStoreFile, releaseStorePassword, releaseKeyAlias, releaseKeyPassword]
    .every { it != null && !it.trim().isEmpty() }

tasks.register('validateReleaseSigning') {
    doLast {
        def missing = []
        if (!releaseStoreFile?.trim()) missing << 'ANDROID_KEYSTORE_PATH'
        if (!releaseStorePassword?.trim()) missing << 'ANDROID_KEYSTORE_PASSWORD'
        if (!releaseKeyAlias?.trim()) missing << 'ANDROID_KEY_ALIAS'
        if (!releaseKeyPassword?.trim()) missing << 'ANDROID_KEY_PASSWORD'
        if (!missing.isEmpty()) {
            throw new GradleException('Release APK signing requires environment variables: ' + missing.join(', '))
        }
        def keystore = file(releaseStoreFile)
        if (!keystore.isAbsolute()) {
            throw new GradleException('ANDROID_KEYSTORE_PATH must be an absolute path')
        }
        if (!keystore.isFile() || !keystore.canRead()) {
            throw new GradleException('ANDROID_KEYSTORE_PATH must point to a readable keystore file')
        }
    }
}

tasks.matching { it.name == 'assembleRelease' || it.name == 'bundleRelease' }.configureEach {
    dependsOn tasks.named('validateReleaseSigning')
}

android {
    signingConfigs {
        if (releaseSigningReady) {
            release {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    namespace "com.cqjtu.app"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.cqjtu.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode = configuredVersionCode.toInteger()
        versionName = configuredVersionName.toString()
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (releaseSigningReady) signingConfig signingConfigs.release
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
